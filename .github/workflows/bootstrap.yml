name: Bootstrap Escudo source

on:
  push:
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
      - "bootstrap_payload.b64"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload.part* > /tmp/escudo-source.tar.gz.b64
          base64 --decode /tmp/escudo-source.tar.gz.b64 > /tmp/escudo-source.tar.gz
          echo "8a52c949bf82d8e927e23d2cb483d6bd2f794356e292c3a66f951981ed7d2799  /tmp/escudo-source.tar.gz" | sha256sum --check

      - name: Expand Escudo project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/escudo-source
          tar -xzf /tmp/escudo-source.tar.gz -C /tmp/escudo-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/escudo-source/. .

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import Escudo Android MVP v0.9"
          git push origin HEAD:main
