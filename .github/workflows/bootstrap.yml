name: Bootstrap and validate Escudo

on:
  push:
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
      - "bootstrap_payload.b64"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload.part* > /tmp/escudo-source.tar.gz.b64
          base64 --decode /tmp/escudo-source.tar.gz.b64 > /tmp/escudo-source.tar.gz
          echo "8a52c949bf82d8e927e23d2cb483d6bd2f794356e292c3a66f951981ed7d2799  /tmp/escudo-source.tar.gz" | sha256sum --check
          mkdir -p /tmp/escudo-source
          tar -xzf /tmp/escudo-source.tar.gz -C /tmp/escudo-source

      - name: Apply CI-discovered v0.9 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/escudo-source")
          bridge = root / "app/src/main/java/com/escudo/app/clone/CloneBridgeService.kt"
          text = bridge.read_text()
          text = text.replace("import android.os.Process\\n", "").replace("import android.os.UserHandle\\n", "")
          text = text.replace(
              '''    private fun enforceEscudoCaller() {\\n        val callerAppId = UserHandle.getAppId(Binder.getCallingUid())\\n        val myAppId = UserHandle.getAppId(Process.myUid())\\n        check(callerAppId == myAppId) { "Caller no autorizado" }\\n    }\\n''',
              '''    private fun enforceEscudoCaller() {\\n        val callerPackages = packageManager.getPackagesForUid(Binder.getCallingUid()).orEmpty()\\n        check(packageName in callerPackages) { "Caller no autorizado" }\\n    }\\n'''
          )
          text = text.replace(
              "the calling appId matches Escudo's appId, so possession of the Binder alone is not enough for an",
              "the calling UID resolves to Escudo's package, so possession of the Binder alone is not enough for an"
          )
          bridge.write_text(text)

          check = root / "tools/security-regression-check.sh"
          text = check.read_text().replace(
              "grep -q 'UserHandle.getAppId' \\\"$BRIDGE_SERVICE\\\" || fail \\\"el Binder debe verificar el appId de Escudo en cada IPC\\\"",
              "grep -q 'getPackagesForUid(Binder.getCallingUid())' \\\"$BRIDGE_SERVICE\\\" || fail \\\"el Binder debe verificar que cada IPC provenga del paquete Escudo\\\""
          )
          check.write_text(text)

          android_ci = root / ".github/workflows/android.yml"
          android_ci.write_text(android_ci.read_text().replace("android-actions/setup-android@v3", "android-actions/setup-android@v4"))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Core self-test
        working-directory: /tmp/escudo-source
        run: ./tools/core-self-test.sh

      - name: Security regression check
        working-directory: /tmp/escudo-source
        run: ./tools/security-regression-check.sh

      - name: Unit tests
        working-directory: /tmp/escudo-source
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: /tmp/escudo-source
        run: gradle :app:lintDebug :demo-target:lintDebug --stacktrace

      - name: Build APKs
        working-directory: /tmp/escudo-source
        run: gradle :app:assembleDebug :demo-target:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: escudo-v0.9-debug-apks
          path: |
            /tmp/escudo-source/app/build/outputs/apk/debug/*.apk
            /tmp/escudo-source/demo-target/build/outputs/apk/debug/*.apk

      - name: Expand project onto main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/escudo-source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Escudo Android MVP v0.9"
          git push origin HEAD:main
