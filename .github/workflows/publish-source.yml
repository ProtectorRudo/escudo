name: Publish Escudo source

"on":
  push:
    paths:
      - ".github/workflows/publish-source.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload.part* > /tmp/escudo-source.tar.gz.b64
          base64 --decode /tmp/escudo-source.tar.gz.b64 > /tmp/escudo-source.tar.gz
          echo "8a52c949bf82d8e927e23d2cb483d6bd2f794356e292c3a66f951981ed7d2799  /tmp/escudo-source.tar.gz" | sha256sum --check
          mkdir -p /tmp/escudo-source
          tar -xzf /tmp/escudo-source.tar.gz -C /tmp/escudo-source

      - name: Apply confirmed v0.10 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          root = Path("/tmp/escudo-source")

          bridge = root / "app/src/main/java/com/escudo/app/clone/CloneBridgeService.kt"
          s = bridge.read_text().replace("import android.os.Process\n", "").replace("import android.os.UserHandle\n", "")
          begin = s.index("    private fun enforceEscudoCaller() {")
          finish = s.index("\n    private fun scheduleStop()", begin)
          s = s[:begin] + """    private fun enforceEscudoCaller() {
              val callerPackages = packageManager.getPackagesForUid(Binder.getCallingUid()).orEmpty()
              check(packageName in callerPackages) { "Caller no autorizado" }
          }
          """ + s[finish:]
          bridge.write_text(s)

          provisioning = root / "app/src/main/java/com/escudo/app/policy/ProvisioningController.kt"
          s = provisioning.read_text()
          begin = s.index("    val isManagedProfile: Boolean")
          finish = s.index("\n    val isProfileOwner: Boolean", begin)
          s = s[:begin] + """    val isManagedProfile: Boolean
              get() = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  userManager.isManagedProfile
              } else {
                  isProfileOwner && !isDeviceOwner
              }
          """ + s[finish:]
          provisioning.write_text(s)

          check = root / "tools/security-regression-check.sh"
          lines = check.read_text().splitlines()
          dq = chr(34)
          replacement = "grep -q 'getPackagesForUid(Binder.getCallingUid())' " + dq + "$BRIDGE_SERVICE" + dq + " || fail " + dq + "el Binder debe verificar que cada IPC provenga del paquete Escudo" + dq
          lines = [replacement if "UserHandle.getAppId" in line and "$BRIDGE_SERVICE" in line else line for line in lines]
          check.write_text("\n".join(lines) + "\n")

          app_gradle = root / "app/build.gradle.kts"
          s = app_gradle.read_text()
          if "androidx.fragment:fragment-ktx" not in s:
              s = s.replace(
                  '    implementation("androidx.biometric:biometric:1.1.0")\n',
                  '    implementation("androidx.biometric:biometric:1.1.0")\n    implementation("androidx.fragment:fragment-ktx:1.8.5")\n'
              )
          app_gradle.write_text(s)

          wf = root / ".github/workflows/android.yml"
          wf.write_text(wf.read_text().replace("android-actions/setup-android@v3", "android-actions/setup-android@v4"))
          PY

      - name: Replace bootstrap repository with normal Android source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/escudo-source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Escudo Android source v0.10"
          git push origin HEAD:main
